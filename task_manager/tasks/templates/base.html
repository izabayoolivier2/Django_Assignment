<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background: linear-gradient(135deg, #A8D0E6, #F1FAEE); /* Winter chill gradient */
            color: #1D3557; /* Dark icy blue */
            text-align: center;
        }
        nav {
            background: #1D3557; /* Dark icy blue for navbar */
            padding: 15px;
            color: white;
            text-align: center;
        }
        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        nav form button {
            background: #F1FAEE; /* Winter white for the button */
            color: #1D3557; /* Dark icy blue */
            border: 2px solid #1D3557;
            padding: 8px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        nav form button:hover {
            opacity: 0.8;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .container h1 {
            color: #457B9D; /* Light blue-gray */
            font-size: 36px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>  <!-- This should always go to home.html -->
        {% if user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
    

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
